<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2940">
<title>德瑞雪國手札 2027</title>
<style>
:root{
  --snow:#F3F7F9; --paper:#FFFFFF; --ink:#10283C; --ink2:#4A6373; --glacier:#1D5B7B;
  --ice:#DCE9F0; --ice2:#EBF3F7; --line:#C9D9E2; --red:#D6281F; --redbg:#FCE9E7; --gold:#9A6B12; --goldbg:#F8EFD8;
  --night:#0E2940; --night2:#16405B;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC","Noto Sans CJK TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--snow);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--glacier);outline-offset:2px;border-radius:6px}
a{color:var(--glacier)}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.3}
h2{font-size:22px;margin:30px 0 4px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 12px}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(243,247,249,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:48px}
.top b{font-family:var(--serif);font-size:17px;letter-spacing:.04em}
.top span{font-size:13px;color:var(--ink2)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:8px 0 7px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:13px;color:var(--ink2)}
.nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--red);font-weight:700}

/* hero */
.hero{background:linear-gradient(180deg,var(--night),var(--night2));color:#fff;padding:22px 0 26px;border-radius:0 0 26px 26px}
.hero .meta{font-size:14px;color:#B9D2E0;margin:0 0 6px}
.hero h1{font-size:38px;letter-spacing:.06em;font-weight:900}
.hero .dest{margin:6px 0 0;color:#E4EFF5;font-size:15px}
.route{margin:16px -4px 6px}
.route svg{width:100%;height:auto;display:block}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.board div{background:#081B2B;border:1px solid #2A5570;border-radius:10px;text-align:center;padding:8px 0 6px}
.board b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;font-family:var(--sans);font-weight:700}
.board small{font-size:12px;color:#9DBFD1}
.state{margin-top:10px;background:#081B2B;border:1px solid #2A5570;border-radius:10px;padding:12px 14px;text-align:center;font-size:18px}
.state b{color:#fff}
.state em{color:#FF8B80;font-style:normal;font-weight:700}
.cdlabel{margin:14px 0 0;font-size:13px;color:#B9D2E0}

/* tags */
.ai{display:inline-block;font-size:12px;line-height:1;padding:3px 7px;border:1px dashed var(--glacier);color:var(--glacier);
  background:var(--ice2);border-radius:999px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--ice);color:var(--glacier);font-weight:600}
.chip.red{background:var(--redbg);color:var(--red)}
.chip.gold{background:var(--goldbg);color:var(--gold)}
.warn{color:var(--red);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--glacier);
  background:var(--paper);color:var(--glacier);font-weight:600;text-decoration:none;font-size:15px}
.btn.fill{background:var(--glacier);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* boarding pass */
.pass{position:relative;display:flex;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin:14px 0}
.pass::before,.pass::after{content:"";position:absolute;right:calc(32% - 9px);width:18px;height:18px;border-radius:50%;background:var(--snow);border:1px solid var(--line)}
.pass::before{top:-10px;clip-path:inset(50% 0 0 0)}
.pass::after{bottom:-10px;clip-path:inset(0 0 50% 0)}
.pass .m{flex:1;padding:14px 14px 14px 16px;min-width:0}
.pass .s{width:32%;border-left:2px dashed var(--line);padding:14px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px}
.pass .no{font-size:13px;color:var(--ink2)}
.pass .big{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--red)}
.pass .rt{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:22px;font-weight:700}
.pass .rt i{flex:1;border-top:2px solid var(--line);position:relative;min-width:20px}
.pass .rt i::after{content:"";position:absolute;right:-1px;top:-6px;border:5px solid transparent;border-left:8px solid var(--line)}
.pass .ln{font-size:14px;color:var(--ink2);margin-top:4px}

/* lodging rows */
.lodge{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.lodge .hd{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.lodge .dt{min-width:64px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.lodge .dt b{display:block;font-family:var(--serif);font-size:24px;line-height:1.1;color:var(--glacier)}
.lodge .dt small{font-size:12px;color:var(--ink2)}
.lodge h3{font-size:17px}
.lodge .ct{font-size:14px;color:var(--ink2)}
.lodge .bd{padding:0 14px 12px;font-size:14px}
.lodge dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px}
.lodge dt{color:var(--ink2)} .lodge dd{margin:0;word-break:break-word}
.lodge .acts{display:flex;gap:8px;flex-wrap:wrap}
.lodge.pending{border-color:var(--red);border-style:dashed}

/* ticket rows */
.tk{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tk:last-child{border-bottom:0}
.tk .t{flex:1;min-width:0}
.tk b{display:block;font-size:16px}
.tk span{font-size:14px;color:var(--ink2)}
.tgl{min-width:84px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:14px;font-weight:600;color:var(--ink2)}
.tgl[aria-pressed="true"]{background:var(--glacier);border-color:var(--glacier);color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:12px 0}

/* emergency */
.sos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sos a{display:block;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);min-height:64px}
.sos a b{display:block;font-family:var(--serif);font-size:24px;color:var(--red);line-height:1.2}
.sos a span{font-size:13px;color:var(--ink2)}
.sos a.wide{grid-column:1/-1}
.notes{margin:8px 0;padding:0;list-style:none}
.notes li{padding:10px 0 10px 18px;border-bottom:1px solid var(--line);position:relative;font-size:15px}
.notes li:last-child{border-bottom:0}
.notes li::before{content:"";position:absolute;left:0;top:19px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.contactrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.contactrow div{flex:1;min-width:0}
.form{display:grid;gap:8px;margin-top:8px}
input[type=text],input[type=number],select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--paper)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.x{border:0;background:none;color:var(--ink2);min-width:44px;min-height:44px;font-size:20px}

/* itinerary */
.days{position:sticky;top:calc(48px + env(safe-area-inset-top));z-index:15;background:var(--snow);border-bottom:1px solid var(--line)}
.days .sc{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scroll-snap-type:x proximity;scrollbar-width:none}
.days .sc::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;scroll-snap-align:center;min-width:62px;min-height:56px;padding:5px 8px;border-radius:14px;border:1px solid var(--line);background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;position:relative}
.pill b{font-family:var(--serif);font-size:16px}
.pill small{font-size:12px;color:var(--ink2)}
.pill[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill[aria-selected="true"] small{color:#C6D8E3}
.pill.cny::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.dayhead{padding:18px 0 6px}
.dayhead .k{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.dayhead h2{margin:0 0 8px;font-size:23px}
.facts{display:grid;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.facts div{display:grid;grid-template-columns:52px 1fr;gap:8px}
.facts span{color:var(--ink2)}
.prog{height:8px;background:var(--ice);border-radius:99px;overflow:hidden;margin:12px 0 2px}
.prog i{display:block;height:100%;background:var(--glacier);border-radius:99px;transition:width .3s}
.tl{position:relative;margin:14px 0;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;width:2px;background:var(--line)}
.it{position:relative;display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;transition:opacity .2s}
.cb{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:2px solid var(--glacier);background:var(--snow);display:flex;align-items:center;justify-content:center;padding:0;position:relative;z-index:1}
.cb svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.cb[aria-checked="true"]{background:var(--glacier)}
.cb[aria-checked="true"] svg{opacity:1}
.card{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.it.done{opacity:.5}
.it.done .nm{text-decoration:line-through;text-decoration-color:var(--ink2)}
.tm{display:inline-block;font-size:13px;font-weight:700;color:var(--glacier);background:var(--ice2);padding:1px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.tm.t{background:var(--redbg);color:var(--red)}
.nm{font-size:17px;font-weight:700;margin:5px 0 2px;line-height:1.4}
.md,.nt,.st{font-size:14px;color:var(--ink2);margin:2px 0}
.st{color:var(--gold)}
.card .btn{margin-top:8px}

/* packing */
.big-prog{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0}
.big-prog .n{display:flex;justify-content:space-between;align-items:baseline}
.big-prog b{font-family:var(--serif);font-size:32px}
.pk h3{font-size:18px;margin:22px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.pk h3 small{font-family:var(--sans);font-size:13px;color:var(--ink2);font-weight:400}
.pi{display:flex;align-items:center;gap:6px;min-height:52px;border-bottom:1px solid var(--line)}
.pi button.lab{flex:1;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:none;padding:6px 0;min-height:52px}
.pi .bx{flex:0 0 28px;width:28px;height:28px;border-radius:8px;border:2px solid var(--glacier);display:flex;align-items:center;justify-content:center;background:var(--paper)}
.pi .bx svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.pi.on .bx{background:var(--glacier)} .pi.on .bx svg{opacity:1}
.pi.on .tx{color:var(--ink2);text-decoration:line-through}
.pi .tx small{display:block;color:var(--ink2);font-size:13px;line-height:1.4}
.addrow{display:flex;gap:8px;margin:12px 0}
.addrow input{flex:1}
.clim{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.clim div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.clim b{display:block;font-family:var(--serif);font-size:16px}

/* expense */
.sum{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.sum .line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--ice)}
.sum .line:last-child{border:0}
.sum .tot{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--ink)}
.sum .each{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;margin-top:10px;display:flex;justify-content:space-between;align-items:baseline}
.sum .each b{font-family:var(--serif);font-size:26px}
.bud{display:grid;grid-template-columns:1fr 92px 74px 44px;gap:6px;align-items:center;margin:6px 0}
.bud input,.bud select{min-height:44px;padding:0 8px}
.bud .nm2{font-size:15px;padding-left:2px}
.exi{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.exi .l{flex:1;min-width:0}
.exi b{display:block}
.exi span{font-size:13px;color:var(--ink2)}
.exi .am{text-align:right;font-variant-numeric:tabular-nums}
.exi .am small{display:block;font-size:12px;color:var(--ink2)}
.settle{margin:8px 0 0;padding:0;list-style:none}
.settle li{padding:8px 12px;background:var(--ice2);border-radius:10px;margin:6px 0;font-size:15px}
details{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:12px 0}
summary{min-height:50px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details > div{padding-bottom:12px}
.empty{color:var(--ink2);text-align:center;padding:20px 0;font-size:15px}
.foot{font-size:12px;color:var(--ink2);margin:26px 0 10px;text-align:center}
@media (max-width:370px){.hero h1{font-size:32px}.board b{font-size:25px}.bud{grid-template-columns:1fr 82px 66px 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function todayIndex(){const n=new Date(),k=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");

function toTWD(a,c){return (parseFloat(a)||0)*(S.rates[c]||1)}

/* ============ 分頁 ============ */
function setTab(t){S.tab=t;save();
  $$("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));
  ["ov","it","pk","ex"].forEach(k=>$("#tab-"+k).classList.toggle("hidden",k!==t));
  const T={ov:"德瑞雪國手札",it:"每日行程",pk:"行前打包",ex:"記帳與分帳"};$("#ttl").textContent=T[t];
  if(t==="ov")renderOv();if(t==="it")renderIt();if(t==="pk")renderPk();if(t==="ex")renderEx();
  window.scrollTo(0,0);
  if(t==="it"){const a=$(".pill[aria-selected=true]");if(a)a.scrollIntoView({inline:"center",block:"nearest"})}}
$$("[data-tab]").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

function tick(){const el=$("#cd");if(!el)return;
  const now=Date.now(),dep=new Date(TRIP.depart).getTime(),ret=new Date(TRIP.ret).getTime();
  if(now<dep){const s=Math.floor((dep-now)/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;
    el.innerHTML='<p class="cdlabel">距離出發（1/27 23:25 桃園起飛）</p><div class="board"><div><b>'+d+'</b><small>天</small></div><div><b>'+String(h).padStart(2,"0")+'</b><small>時</small></div><div><b>'+String(m).padStart(2,"0")+'</b><small>分</small></div><div><b>'+String(c).padStart(2,"0")+'</b><small>秒</small></div></div>'}
  else if(now<=ret){const i=todayIndex();el.innerHTML='<div class="state"><em>旅程進行中</em>'+(i>=0?'<br><b>Day '+DAYS[i].d+'・'+esc(DAYS[i].title)+'</b>':'')+'</div>'}
  else el.innerHTML='<div class="state"><b>旅程已圓滿結束</b><br>這本手札留給你回味</div>'}

  $("#tab-pk").innerHTML=h;}

/* ============ 記帳 ============ */
function payerOpts(sel){return S.names.map((n,i)=>'<option value="'+i+'"'+(sel===i?' selected':'')+'>'+esc(n||("旅伴 "+(i+1)))+'</option>').join("")}
function renderEx(){
  let h='<div class="wrap"><div id="stats"></div>';
  h+='<h2 style="margin-top:6px">快速記帳</h2><div class="form"><input type="text" id="en" placeholder="項目名稱，例如：少女峰午餐" aria-label="項目名稱">'+
   '<div class="row3"><input type="number" id="ea" inputmode="decimal" min="0" step="any" placeholder="金額" aria-label="金額"><select id="ec" aria-label="幣別"><option value="EUR">歐元 EUR</option><option value="CHF">瑞郎 CHF</option><option value="TWD">台幣 TWD</option></select></div>'+
   '<select id="ep" aria-label="付款人">'+payerOpts(0)+'</select><button class="btn red" id="eadd">新增花費</button></div>';
  h+='<h2>花費紀錄</h2><div id="elist"></div>';
  h+='<h2>預估費用（出發前）</h2><p class="sub">行程表沒有金額，請自行填入已知費用，系統會一起加總。</p><div id="bud"></div><div class="row2" style="margin-top:8px"><input type="text" id="bn" placeholder="新增預估項目" aria-label="預估項目名稱"><button class="btn" id="badd">新增項目</button></div>';
  h+='<details><summary>旅伴名單與匯率</summary><div><p class="sub">改成真實名字，付款人與分帳結果會一起更新。</p><div class="form" id="nm">'+
    S.names.map((n,i)=>'<input type="text" data-nm="'+i+'" value="'+esc(n)+'" aria-label="旅伴 '+(i+1)+'">').join("")+'</div>'+
    '<p class="sub" style="margin-top:14px">參考匯率（換算成台幣）'+AI+'，為概略值，出發前請依銀行牌告更新。</p><div class="row2"><label>1 歐元 = <input type="number" id="r1" inputmode="decimal" step="0.01" value="'+S.rates.EUR+'"></label><label>1 瑞郎 = <input type="number" id="r2" inputmode="decimal" step="0.01" value="'+S.rates.CHF+'"></label></div></div></details>';
  h+='<p class="foot">資料只存在這支裝置，清除瀏覽器資料會一併刪除。</p></div>';
  $("#tab-ex").innerHTML=h;updateStats();renderList();renderBud();}
function calc(){
  const actual=S.exp.reduce((a,e)=>a+toTWD(e.amt,e.cur),0),bud=S.budget.reduce((a,b)=>a+toTWD(b.amt,b.cur),0);
  const paid=S.names.map((_,i)=>S.exp.filter(e=>e.payer===i).reduce((a,e)=>a+toTWD(e.amt,e.cur),0));
  return{actual,bud,all:actual+bud,paid,share:actual/6}}
function settle(c){const net=c.paid.map(p=>p-c.share),cr=[],db=[];
  net.forEach((v,i)=>{if(v>0.5)cr.push([i,v]);else if(v<-0.5)db.push([i,-v])});
  const out=[];let i=0,j=0;while(i<db.length&&j<cr.length){const m=Math.min(db[i][1],cr[j][1]);out.push([db[i][0],cr[j][0],m]);db[i][1]-=m;cr[j][1]-=m;if(db[i][1]<0.5)i++;if(cr[j][1]<0.5)j++}return out}
function updateStats(){const el=$("#stats");if(!el)return;const c=calc(),nm=i=>S.names[i]||("旅伴 "+(i+1));
  const st=settle(c);
  let h='<div class="sum"><div class="line"><span>預估費用（出發前）</span><b>NT$ '+fmt(c.bud)+'</b></div><div class="line"><span>現場花費</span><b>NT$ '+fmt(c.actual)+'</b></div>'+
   '<div class="line"><span>合併總計</span><span class="tot">NT$ '+fmt(c.all)+'</span></div>'+
   '<div class="each"><span>現場花費每人平均（6 人）</span><b>NT$ '+fmt(c.share)+'</b></div>'+
   '<div class="each" style="background:var(--glacier)"><span>合併總計每人平均</span><b>NT$ '+fmt(c.all/6)+'</b></div></div>';
  if(S.exp.length){h+='<div class="sum"><b style="font-family:var(--serif);font-size:18px">誰先墊了多少</b>'+S.names.map((n,i)=>'<div class="line"><span>'+esc(nm(i))+'</span><span>已付 NT$ '+fmt(c.paid[i])+'（'+(c.paid[i]-c.share>=0?'多付 ':'少付 ')+fmt(Math.abs(c.paid[i]-c.share))+'）</span></div>').join("")+
    '<b style="font-family:var(--serif);font-size:18px;display:block;margin-top:10px">結算建議</b>'+(st.length?'<ul class="settle">'+st.map(s=>'<li>'+esc(nm(s[0]))+' 付給 '+esc(nm(s[1]))+'　<b>NT$ '+fmt(s[2])+'</b></li>').join("")+'</ul><button class="btn sm" id="cpy" style="margin-top:6px">複製結算</button>':'<div class="empty" style="padding:8px 0">目前不需要互相轉帳</div>')+'</div>'}
  el.innerHTML=h}
function renderList(){const el=$("#elist");if(!el)return;
  el.innerHTML=S.exp.length?S.exp.slice().reverse().map(e=>{const nm=S.names[e.payer]||("旅伴 "+(e.payer+1));
    return '<div class="exi"><div class="l"><b>'+esc(e.name)+'</b><span>'+esc(nm)+' 付款・'+e.date+'</span></div><div class="am">'+(e.cur==="TWD"?'NT$ '+fmt(e.amt):fmt(e.amt)+' '+e.cur+'<small>≈ NT$ '+fmt(toTWD(e.amt,e.cur))+'</small>')+'</div><button class="x" data-dele="'+e.id+'" aria-label="刪除">×</button></div>'}).join(""):'<div class="empty">還沒有記帳，花下第一筆就新增吧。</div>'}
function renderBud(){const el=$("#bud");if(!el)return;
  el.innerHTML=S.budget.map(b=>'<div class="bud"><span class="nm2">'+esc(b.name)+'</span><input type="number" inputmode="decimal" min="0" step="any" data-ba="'+b.id+'" value="'+esc(b.amt)+'" placeholder="金額" aria-label="'+esc(b.name)+'金額"><select data-bc="'+b.id+'" aria-label="幣別">'+["TWD","EUR","CHF"].map(c=>'<option'+(b.cur===c?' selected':'')+'>'+c+'</option>').join("")+'</select><button class="x" data-delb="'+b.id+'" aria-label="刪除">×</button></div>').join("")}

/* ============ 事件 ============ */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,a");if(!t)return;
  if(t.dataset.doc){S.doc[t.dataset.doc]=!S.doc[t.dataset.doc];save();renderOvKeep();return}
  if(t.dataset.day!=null&&t.classList.contains("pill")){S.day=+t.dataset.day;save();renderIt();const a=$(".pill[aria-selected=true]");if(a)a.scrollIntoView({inline:"center",block:"nearest"});window.scrollTo(0,0);return}
  if(t.dataset.step){S.day=curDay()+(+t.dataset.step);save();renderIt();window.scrollTo(0,0);return}
  if(t.dataset.chk){const k=t.dataset.chk;S.done[k]=!S.done[k];save();
    const li=t.closest(".it");li.classList.toggle("done",!!S.done[k]);t.setAttribute("aria-checked",String(!!S.done[k]));
    const D=DAYS[curDay()],n=D.items.filter((_,i)=>S.done["d"+D.d+"-"+i]).length;$("#dayc").textContent="已完成 "+n+" / "+D.items.length+" 項";$(".prog i").style.width=(n/D.items.length*100)+"%";return}
  if(t.dataset.pk){S.pack[t.dataset.pk]=!S.pack[t.dataset.pk];save();const y=window.scrollY;renderPk();window.scrollTo(0,y);return}
  if(t.dataset.delp){S.packCustom=S.packCustom.filter(x=>x.id!==t.dataset.delp);delete S.pack[t.dataset.delp];save();const y=window.scrollY;renderPk();window.scrollTo(0,y);return}
  if(t.id==="padd"){addPack();return}
  if(t.id==="addc"){const n=$("#cn").value.trim(),p=$("#cp").value.trim();if(!n||!p){(n?$("#cp"):$("#cn")).focus();return}
    S.contacts.push({id:uid(),n,p});save();$("#cn").value="";$("#cp").value="";renderContacts();return}
  if(t.dataset.delc){S.contacts=S.contacts.filter(x=>x.id!==t.dataset.delc);save();renderContacts();return}
  if(t.id==="eadd"){addExp();return}
  if(t.dataset.dele){S.exp=S.exp.filter(x=>x.id!==t.dataset.dele);save();updateStats();renderList();return}
  if(t.id==="badd"){const n=$("#bn").value.trim();if(!n){$("#bn").focus();return}S.budget.push({id:uid(),name:n,amt:"",cur:"TWD"});save();$("#bn").value="";renderBud();return}
  if(t.dataset.delb){S.budget=S.budget.filter(x=>x.id!==t.dataset.delb);save();renderBud();updateStats();return}
  if(t.id==="cpy"){const c=calc(),st=settle(c),nm=i=>S.names[i]||("旅伴 "+(i+1));
    const txt="德瑞旅遊分帳\n現場花費 NT$ "+fmt(c.actual)+"，每人 NT$ "+fmt(c.share)+"\n"+st.map(s=>nm(s[0])+" 付給 "+nm(s[1])+" NT$ "+fmt(s[2])).join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{t.textContent="已複製"}).catch(()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");t.textContent="已複製"}catch(e){t.textContent="請手動複製"}ta.remove()});return}
});
function renderOvKeep(){const y=window.scrollY;renderOv();window.scrollTo(0,y)}
function addPack(){const i=$("#pnew"),v=i.value.trim();if(!v){i.focus();return}S.packCustom.push({id:"c"+uid(),t:v});save();const y=window.scrollY;renderPk();window.scrollTo(0,y)}
function addExp(){const n=$("#en"),a=$("#ea");const name=n.value.trim(),amt=parseFloat(a.value);
  if(!name){n.focus();return}if(!(amt>0)){a.focus();return}
  const now=new Date();S.exp.push({id:uid(),name,amt,cur:$("#ec").value,payer:+$("#ep").value,date:(now.getMonth()+1)+"/"+now.getDate()});
  save();n.value="";a.value="";updateStats();renderList();n.focus()}
document.addEventListener("keydown",ev=>{if(ev.key!=="Enter")return;const id=ev.target.id;if(id==="pnew")addPack();else if(id==="en"||id==="ea")addExp();else if(id==="cn"||id==="cp")$("#addc").click();else if(id==="bn")$("#badd").click()});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.dataset.ba){const b=S.budget.find(x=>x.id===t.dataset.ba);if(b){b.amt=t.value;save();updateStats()}}
  else if(t.dataset.bc){const b=S.budget.find(x=>x.id===t.dataset.bc);if(b){b.cur=t.value;save();updateStats()}}
  else if(t.id==="r1"||t.id==="r2"){const v=parseFloat(t.value);if(v>0){S.rates[t.id==="r1"?"EUR":"CHF"]=v;save();updateStats();renderList();renderBud()}}});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset.nm!=null){S.names[+t.dataset.nm]=t.value;save();updateStats();renderList();const p=$("#ep");if(p){const v=p.value;p.innerHTML=payerOpts(+v);p.value=v}}});

setTab(S.tab||"ov");
</script>
</body>
</html>
